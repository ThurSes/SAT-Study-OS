Você não está sozinho: preserve edições alheias e não dispute arquivos de outros agentes.
Não reescreva implementação, relaxe segurança ou altere contratos para fazer testes passarem.
Não crie subagentes. Sem achados, diga isso e cite limites; não invente problema ou sucesso.
"""
